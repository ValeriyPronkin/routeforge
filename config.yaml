# Настройки routeforge. Файл необязательный: без него берутся значения по
# умолчанию. Любое поле можно переопределить переменной окружения с
# префиксом ROUTEFORGE_, например ROUTEFORGE_APP_TITLE.

common:
    # Как приложение называет себя на экране. Меняйте под свою задачу.
    app_title: 'routeforge'
    app_subtitle: 'Распределение точек по базам, кластеризация и построение маршрутов'

    # Расстояния: haversine (по прямой, работает сразу) или osrm (по дорогам).
    distance_method: 'haversine'
    osrm_url: 'http://localhost:5000'

    # Журнал работы.
    log_dir: 'logs'
    log_level: 'INFO'
